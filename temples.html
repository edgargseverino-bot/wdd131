<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore temples around the world, learn about their history, locations, and significance.">
    <meta name="author" content="Edgar Gabriel Severino Gastón">
    <title>Temple Album</title>
    <link rel="stylesheet" href="styles/temples-large.css">
    <link rel="stylesheet" href="styles/temples.css">
    <script src="scripts/temples.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header class="heading">
        <div class="left-section">
            <p>Temple Album</p>
        </div>

        <button id="menu"></button>

        <nav class="right-section">
            <ul class="navigation">
                <li><a href="">Home</a></li>            
                <li><a href="">Old</a></li>
                <li><a href="">New</a></li>
                <li><a href="">Large</a></li>
                <li><a href="">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="show-time">
            <h1 class="title">Home</h1>
            <div class="temple-section" id="temples">
                <figure class="portrait">
                    <img src="images/temples/washington_dc.webp" alt="Whashington DC, US">
                    <figcaption class="description">Washington dc temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/salt_lake.webp" alt="${temple.description}">
                    <figcaption class="description">Salt Lake temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/salt_lake.webp" alt="Salt Lake,US">
                    <figcaption class="description">Salt Lake temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/salt_lake.webp" alt="Salt Lake,US">
                    <figcaption class="description">Salt Lake temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/santo_domingo_dr.webp" alt="Santo Domingo, DR">
                    <figcaption class="description">Sant. domingo temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/salt_lake.webp" alt="Salt Lake,US">
                    <figcaption class="description">Salt Lake temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/salt_lake.webp" alt="Salt Lake,US">
                    <figcaption class="description">Salt Lake temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/salt_lake.webp" alt="Salt Lake,US">
                    <figcaption class="description">Salt Lake temple</figcaption>
                </figure>
                <figure class="portrait">
                    <img src="images/temples/roma_italy.webp" alt="Roma, Italy">
                    <figcaption class="description">Roma temple</figcaption>
                </figure>   
            </div>
        </div>
        
    </main>
    <footer>
        <p>
            <span id="currentyear">2026</span>  
            Edgar Severino
            Dominican Republic
        </p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
